name: 构建 APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      proxy_url:
        description: '代理服务地址（APK 内 WebView 调用）'
        required: false
        default: 'http://127.0.0.1:8799'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Android SDK
        env:
          ANDROID_HOME: ${{ github.workspace }}/android-sdk
          ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          if [ ! -d "$ANDROID_HOME/cmdline-tools/latest" ]; then
            curl -sSL -o cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
            rm cmdtools.zip
          fi
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: 安装依赖
        run: npm install

      - name: 写入代理地址
        env:
          PROXY_URL: ${{ github.event.inputs.proxy_url || 'http://127.0.0.1:8799' }}
        run: |
          sed -i "s|const API_BASE = '';|const API_BASE = '${PROXY_URL}';|" public/app.js
          grep -n "API_BASE =" public/app.js

      - name: 生成 Android 工程
        run: npx cap add android

      - name: 同步 Web 资源
        run: npx cap copy android

      - name: 构建调试 APK
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: raccoon-mobile-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
