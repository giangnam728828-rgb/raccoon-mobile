name: 构建 APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      proxy_url:
        description: '（可选）代理地址。App 默认直连官方，留空即可；填了则作为备用通道预置'
        required: false
        default: ''
      access_key:
        description: '代理访问密钥（服务端设了 ACCESS_KEY 才需要填）'
        required: false
        default: ''

env:
  # 固定签名证书的 SHA-256 指纹，构建后强制比对，防止签名漂移
  EXPECTED_CERT_SHA256: '11BC39DC78502E5F4BC73F05885EDC7C5DE8DA41D9DA5BC5A17E0FE8FDE80CB6'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: 跑冒烟测试
        run: npm test

      - name: 配置 Android SDK
        env:
          ANDROID_HOME: ${{ github.workspace }}/android-sdk
          ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          if [ ! -d "$ANDROID_HOME/cmdline-tools/latest" ]; then
            curl -sSL -o cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
            rm cmdtools.zip
          fi
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: 写入备用代理地址与访问密钥
        env:
          PROXY_URL: ${{ github.event.inputs.proxy_url || '' }}
          ACCESS_KEY: ${{ github.event.inputs.access_key || '' }}
        run: |
          node -e '
            const fs = require("fs");
            const p = "public/js/api.js";
            let s = fs.readFileSync(p, "utf8");
            const url = process.env.PROXY_URL || "";
            if (url) {
              s = s.replace(/const API_BASE = \x27\x27;/, "const API_BASE = \x27" + url + "\x27;");
            }
            s = s.replace(/const ACCESS_KEY = \x27\x27;/, "const ACCESS_KEY = \x27" + (process.env.ACCESS_KEY || "") + "\x27;");
            fs.writeFileSync(p, s);
          '
          grep -n "const API_BASE" public/js/api.js
          grep -n "const ACCESS_KEY" public/js/api.js
          echo "App 默认直连官方；未填 proxy_url 时不会预置任何代理地址。"

      - name: 生成 Android 工程
        run: npx cap add android

      - name: 注入原生流式通道
        run: python3 scripts/inject-native-plugin.py android

      - name: 注入应用图标
        run: python3 scripts/inject-icon.py android

      - name: 允许明文 HTTP（本地代理默认没有证书）
        run: |
          M=android/app/src/main/AndroidManifest.xml
          if ! grep -q 'usesCleartextTraffic' "$M"; then
            sed -i '0,/<application/s|<application|<application android:usesCleartextTraffic="true"|' "$M"
          fi
          grep -n 'usesCleartextTraffic' "$M"

      - name: 同步 Web 资源
        run: npx cap copy android

      - name: 配置固定签名
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::仓库未配置签名密钥，本次产出的是 debug 签名包，无法覆盖升级"
            echo "BUILD_TYPE=debug" >> "$GITHUB_ENV"
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/app/raccoon-release.jks
          ls -l android/app/raccoon-release.jks
          python3 scripts/inject-signing.py android/app/build.gradle
          echo "BUILD_TYPE=release" >> "$GITHUB_ENV"

      - name: 设置版本号
        run: python3 scripts/set-version.py "${{ github.run_number }}"

      - name: 构建 APK
        env:
          ANDROID_HOME: ${{ github.workspace }}/android-sdk
          ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ "$BUILD_TYPE" = "release" ]; then
            cd android && ./gradlew assembleRelease -x lintVitalRelease --no-daemon
          else
            cd android && ./gradlew assembleDebug --no-daemon
          fi

      - name: 校验签名指纹
        run: |
          if [ "$BUILD_TYPE" != "release" ]; then
            echo "::warning::跳过指纹校验（本次是 debug 包）"
            exit 0
          fi
          APK=$(ls android/app/build/outputs/apk/release/*.apk | grep -v unsigned | head -1)
          echo "APK: $APK"
          if ls android/app/build/outputs/apk/release/*unsigned* > /dev/null 2>&1; then
            echo "::error::产出了未签名包，签名配置未生效"
            exit 1
          fi
          ACTUAL=$(keytool -printcert -jarfile "$APK" | grep -i "SHA256:" | head -1 \
                   | sed 's/.*SHA256:[[:space:]]*//' | tr -d ':[:space:]' | tr 'a-f' 'A-F')
          echo "期望指纹: $EXPECTED_CERT_SHA256"
          echo "实际指纹: $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::签名指纹不匹配，覆盖安装会失败"
            exit 1
          fi
          echo "签名指纹一致 OK"

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: raccoon-mobile-apk
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
            !android/app/build/outputs/apk/release/*unsigned*.apk
          if-no-files-found: error
