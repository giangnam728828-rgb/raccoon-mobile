name: 构建 APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      proxy_url:
        description: '代理服务地址（APK 内 WebView 调用，例如 https://raccoon.example.com）'
        required: true
        default: 'http://127.0.0.1:8799'
      access_key:
        description: '代理访问密钥（服务端设了 ACCESS_KEY 才需要填）'
        required: false
        default: ''

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: 跑冒烟测试
        run: npm test

      - name: 配置 Android SDK
        env:
          ANDROID_HOME: ${{ github.workspace }}/android-sdk
          ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          if [ ! -d "$ANDROID_HOME/cmdline-tools/latest" ]; then
            curl -sSL -o cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
            rm cmdtools.zip
          fi
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: 写入代理地址与访问密钥
        env:
          PROXY_URL: ${{ github.event.inputs.proxy_url || 'http://127.0.0.1:8799' }}
          ACCESS_KEY: ${{ github.event.inputs.access_key || '' }}
        run: |
          node -e '
            const fs = require("fs");
            const p = "public/app.js";
            let s = fs.readFileSync(p, "utf8");
            s = s.replace(/const API_BASE = \x27\x27;/, "const API_BASE = \x27" + process.env.PROXY_URL + "\x27;");
            s = s.replace(/const ACCESS_KEY = \x27\x27;/, "const ACCESS_KEY = \x27" + (process.env.ACCESS_KEY || "") + "\x27;");
            fs.writeFileSync(p, s);
          '
          grep -n "const API_BASE" public/app.js
          grep -n "const ACCESS_KEY" public/app.js
          case "$PROXY_URL" in
            http://127.0.0.1*|http://localhost*)
              echo "::warning::代理地址是 127.0.0.1，只有手机上自己在跑 server.js 时才能用" ;;
          esac

      - name: 生成 Android 工程
        run: npx cap add android

      - name: 允许明文 HTTP（本地代理默认没有证书）
        run: |
          M=android/app/src/main/AndroidManifest.xml
          if ! grep -q 'usesCleartextTraffic' "$M"; then
            sed -i '0,/<application/s|<application|<application android:usesCleartextTraffic="true"|' "$M"
          fi
          grep -n 'usesCleartextTraffic' "$M"

      - name: 同步 Web 资源
        run: npx cap copy android

      - name: 构建调试 APK
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: raccoon-mobile-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
