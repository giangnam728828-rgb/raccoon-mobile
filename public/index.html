<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#faf1ee" id="theme-color">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="小浣熊">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="小浣熊移动端：多模型对话、深度思考、图片与文件问答。">
<title>小浣熊</title>
<link rel="icon" href="/img/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>

  <symbol id="i-more" viewBox="0 0 24 24"><circle cx="6" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="18" cy="12" r="1.4" fill="currentColor" stroke="none"/></symbol>

  <symbol id="i-key" viewBox="0 0 24 24"><circle cx="8.2" cy="15.8" r="3.6"/><path d="M10.8 13.2 19 5M15.6 8.4l2.2 2.2M17.8 6.2l2.2 2.2"/></symbol>

<!-- ============================================================
     启动
     ============================================================ -->
<div id="boot">
  <div class="boot-art"><img src="/img/brand-sm.jpg" alt="" width="86" height="86"></div>
  <p class="boot-name">小浣熊</p>
</div>

<!-- ============================================================
     登录
     ============================================================ -->
<section id="login" class="view">
  <div class="login-scroll">
    <header class="login-brand">
      <div class="login-art"><img src="/img/brand-sm.jpg" alt="" width="92" height="92"></div>
      <h1>小浣熊</h1>
      <p>能搞定工作的 AI 助手</p>
    </header>

    <div class="login-form">
      <div class="field">
        <label for="phone">手机号</label>
        <div class="field-row">
          <select id="nation" class="input nation" aria-label="国家或地区代码"></select>
          <input id="phone" class="input" type="tel" inputmode="numeric"
                 autocomplete="tel" placeholder="请输入手机号" maxlength="20">
        </div>
      </div>

      <div class="field">
        <label for="code">短信验证码</label>
        <div class="field-row">
          <input id="code" class="input" type="text" inputmode="numeric"
                 autocomplete="one-time-code" placeholder="6 位验证码" maxlength="8">
          <button id="btn-send-code" class="btn-code" type="button">获取验证码</button>
        </div>
      </div>

      <button id="btn-login" class="btn btn-primary btn-block" type="button">登录 / 注册</button>
      <p class="login-hint">未注册的手机号将自动创建账号</p>
    </div>

    <div class="login-alt">
      <button id="btn-token-toggle" class="btn-text" type="button">
        <svg class="i" style="width:18px;height:18px"><use href="#i-key"/></svg>使用 Token 登录
      </button>
    </div>

    <div id="token-panel" class="hidden" style="margin-top:16px">
      <div class="field">
        <label for="token-input">访问令牌</label>
        <textarea id="token-input" class="input" placeholder="粘贴 access_token（JWT，可带 Bearer 前缀）"
                  spellcheck="false" autocapitalize="off" autocorrect="off"></textarea>
      </div>
      <button id="btn-token-go" class="btn btn-primary btn-block" type="button" style="margin-top:12px">登录</button>
    </div>

    <p id="login-msg" class="login-msg hidden" role="alert"></p>

    <footer class="login-foot">
      <span id="login-mode" class="mono">自动 · 直连官方</span>
      <span class="sep">·</span>
      <button id="btn-diag" class="btn-text" type="button" style="min-height:30px;font-size:11.5px">诊断</button>
    </footer>
  </div>

  <div id="cap-element"></div>
  <button id="cap-button" type="button" hidden>captcha</button>
</section>

<!-- ============================================================
     主应用
     ============================================================ -->
<section id="app" class="view">

  <!-- ---------- 对话 ---------- -->
  <div class="pane on" id="pane-chat">
    <header class="appbar" id="chat-appbar">
      <div class="appbar-row">
        <div class="appbar-title">
          <span class="dot" id="status-dot" aria-hidden="true"></span>
          <span class="t" id="chat-title">新对话</span>
        </div>
        <div class="appbar-actions">
          <button id="btn-points" class="pill" type="button" aria-label="剩余积分">
            <svg class="i"><use href="#i-coin"/></svg><span id="points" class="tnum">—</span>
          </button>
          <button id="btn-new" class="icon-btn" type="button" aria-label="新建对话">
            <svg class="i"><use href="#i-edit"/></svg>
          </button>
        </div>
      </div>
      <div class="appbar-row sub">
        <button id="btn-model" class="pill model" type="button">
          <span id="model-name" class="lbl">默认模型</span>
          <svg class="i"><use href="#i-down"/></svg>
        </button>
        <button id="btn-effort" class="pill" type="button">
          <svg class="i"><use href="#i-bolt"/></svg><span id="effort-name" class="lbl">思考</span>
        </button>
      </div>
    </header>

    <main id="thread" class="thread" role="log" aria-live="polite"></main>

    <button id="jump-bottom" class="jump-bottom hidden" type="button" aria-label="回到底部">
      <svg class="i sm"><use href="#i-down"/></svg>
      <span class="n hidden" id="new-count">0</span>
    </button>

    <div class="composer">
      <div class="composer-inner" id="composer-inner">
        <div id="draft" class="draft-att hidden"></div>
        <div class="composer-top">
          <textarea id="input" rows="1" placeholder="发消息…" enterkeyhint="send"
                    aria-label="消息输入框"></textarea>
          <button id="btn-send" class="send" type="button" disabled aria-label="发送">
            <svg class="i ico-send"><use href="#i-send"/></svg>
            <svg class="i ico-stop hidden"><use href="#i-stop"/></svg>
          </button>
        </div>
        <div class="composer-tools">
          <button id="btn-attach" class="icon-btn sm" type="button" aria-label="添加图片或文件">
            <svg class="i"><use href="#i-plus"/></svg>
          </button>
          <button id="btn-voice" class="icon-btn sm" type="button" aria-label="语音输入">
            <svg class="i"><use href="#i-mic"/></svg>
          </button>
          <div class="spacer"></div>
          <button id="btn-think" class="tool-label hidden" type="button" tabindex="-1" aria-hidden="true">
            <svg class="i"><use href="#i-spark"/></svg><span id="think-label">思考关</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- ---------- 记录 ---------- -->
  <div class="pane" id="pane-history">
    <header class="appbar">
      <div class="appbar-row">
        <div class="appbar-title"><span class="t">对话记录</span></div>
        <div class="appbar-actions">
          <button id="btn-history-new" class="icon-btn" type="button" aria-label="新建对话">
            <svg class="i"><use href="#i-plus"/></svg>
          </button>
        </div>
      </div>
      <div class="appbar-row sub">
        <div class="search">
          <svg class="i sm"><use href="#i-search"/></svg>
          <input id="history-search" type="search" placeholder="搜索标题或内容" enterkeyhint="search">
        </div>
      </div>
    </header>
    <main id="history-list" class="scroll-list"></main>
  </div>

  <!-- ---------- 我的 ---------- -->
  <div class="pane" id="pane-me">
    <header class="appbar">
      <div class="appbar-row">
        <div class="appbar-title"><span class="t">我的</span></div>
        <div class="appbar-actions">
          <button id="btn-settings" class="icon-btn" type="button" aria-label="设置">
            <svg class="i"><use href="#i-settings"/></svg>
          </button>
        </div>
      </div>
    </header>
    <main class="scroll-list">
      <div class="profile">
        <div class="avatar"><img src="/img/brand-sm.jpg" alt="" width="54" height="54"></div>
        <div class="profile-info">
          <div class="nm" id="me-name">小浣熊</div>
          <div class="sub" id="me-phone">—</div>
        </div>
      </div>

      <div class="stat-row">
        <div class="stat"><span class="num tnum" id="st-points">—</span><span class="lbl">剩余积分</span></div>
        <div class="stat"><span class="num tnum" id="st-chats">—</span><span class="lbl">对话</span></div>
        <div class="stat"><span class="num tnum" id="st-msgs">—</span><span class="lbl">消息</span></div>
      </div>

      <div class="group">
        <div class="group-label">对话</div>
        <button class="row" id="row-model" type="button">
          <svg class="i"><use href="#i-spark"/></svg>
          <span class="lbl">默认模型</span>
          <span class="val" id="set-model">—</span>
          <svg class="i chev"><use href="#i-right"/></svg>
        </button>
        <button class="row" id="row-effort" type="button">
          <svg class="i"><use href="#i-bolt"/></svg>
          <span class="lbl">深度思考</span>
          <span class="val" id="set-effort">—</span>
          <svg class="i chev"><use href="#i-right"/></svg>
        </button>
        <button class="row" id="row-system" type="button">
          <svg class="i"><use href="#i-pen"/></svg>
          <span class="lbl">系统提示词</span>
          <span class="val" id="set-system">未设置</span>
          <svg class="i chev"><use href="#i-right"/></svg>
        </button>
        <button class="row" id="row-prompts" type="button">
          <svg class="i"><use href="#i-inbox"/></svg>
          <span class="lbl">提示词库</span>
          <span class="val" id="set-prompts">—</span>
          <svg class="i chev"><use href="#i-right"/></svg>
        </button>
      </div>

      <div class="group">
        <div class="group-label">外观</div>
        <button class="row" id="row-theme" type="button">
          <svg class="i"><use href="#i-palette"/></svg>
          <span class="lbl">主题</span>
          <span class="val" id="set-theme">跟随系统</span>
          <svg class="i chev"><use href="#i-right"/></svg>
        </button>
        <button class="row" id="row-fontsize" type="button">
          <svg class="i"><use href="#i-type"/></svg>
          <span class="lbl">正文字号</span>
          <span class="val" id="set-fontsize">标准</span>
          <svg class="i chev"><use href="#i-right"/></svg>
        </button>
      </div>

      <div class="group">
        <div class="group-label">数据</div>
        <button class="row" id="row-export" type="button">
          <svg class="i"><use href="#i-share"/></svg>
          <span class="lbl">导出当前对话</span>
          <span class="val" id="set-export">Markdown</span>
          <svg class="i chev"><use href="#i-right"/></svg>
        </button>
        <button class="row" id="row-storage" type="button">
          <svg class="i"><use href="#i-database"/></svg>
          <span class="lbl">本地占用</span>
          <span class="val" id="set-storage">—</span>
          <svg class="i chev"><use href="#i-right"/></svg>
        </button>
        <button class="row" id="row-backup" type="button">
          <svg class="i"><use href="#i-share"/></svg>
          <span class="lbl">备份到服务端</span>
          <span class="val" id="set-backup">未备份</span>
          <svg class="i chev"><use href="#i-right"/></svg>
        </button>
        <button class="row" id="row-restore" type="button">
          <svg class="i"><use href="#i-refresh"/></svg>
          <span class="lbl">从服务端恢复</span>
          <svg class="i chev"><use href="#i-right"/></svg>
        </button>
      </div>

      <div class="group">
        <div class="group-label">连接</div>
        <button class="row" id="row-conn" type="button">
          <svg class="i"><use href="#i-link"/></svg>
          <span class="lbl">连接状态</span>
          <span class="val" id="set-conn">检测中…</span>
          <svg class="i chev"><use href="#i-right"/></svg>
        </button>
        <button class="row" id="row-channel" type="button">
          <svg class="i"><use href="#i-database"/></svg>
          <span class="lbl">通道</span>
          <span class="val mono" id="set-channel">自动</span>
          <svg class="i chev"><use href="#i-right"/></svg>
        </button>
      </div>

      <div class="group">
        <div class="group-label">积分</div>
        <button class="row" id="row-checkin" type="button">
          <svg class="i"><use href="#i-coin"/></svg>
          <span class="lbl">领取每日积分</span>
          <svg class="i chev"><use href="#i-right"/></svg>
        </button>
        <button class="row" id="row-onboarding" type="button">
          <svg class="i"><use href="#i-coin"/></svg>
          <span class="lbl">领取新手奖励</span>
          <svg class="i chev"><use href="#i-right"/></svg>
        </button>
      </div>

      <div class="group">
        <button class="row danger" id="row-logout" type="button">
          <svg class="i"><use href="#i-exit"/></svg>
          <span class="lbl">退出登录</span>
        </button>
      </div>

      <p class="build-tag" id="build-tag">小浣熊移动端</p>
    </main>
  </div>

  <!-- ---------- 标签栏 ---------- -->
  <nav class="tabbar" role="tablist" aria-label="主导航">
    <button class="tab" data-tab="chat" role="tab" aria-selected="true" type="button">
      <svg class="i"><use href="#i-chat"/></svg><span>对话</span>
    </button>
    <button class="tab" data-tab="history" role="tab" aria-selected="false" type="button">
      <svg class="i"><use href="#i-history"/></svg><span>记录</span>
    </button>
    <button class="tab" data-tab="me" role="tab" aria-selected="false" type="button">
      <svg class="i"><use href="#i-user"/></svg><span>我的</span>
    </button>
  </nav>
</section>

<!-- ============================================================
     弹层
     ============================================================ -->

<!-- 模型 -->
<div id="sheet-model" class="sheet hidden" role="dialog" aria-modal="true" aria-label="选择模型">
  <div class="sheet-scrim" data-close></div>
  <div class="sheet-panel tall">
    <div class="sheet-grip"></div>
    <div class="sheet-head">
      <span class="t">选择模型</span>
      <button class="icon-btn sm" data-close type="button" aria-label="关闭"><svg class="i"><use href="#i-close"/></svg></button>
    </div>
    <div class="sheet-body" id="model-list"></div>
  </div>
</div>

<!-- 思考强度 -->
<div id="sheet-effort" class="sheet hidden" role="dialog" aria-modal="true" aria-label="深度思考强度">
  <div class="sheet-scrim" data-close></div>
  <div class="sheet-panel tall">
    <div class="sheet-grip"></div>
    <div class="sheet-head">
      <span class="t">深度思考</span>
      <button class="icon-btn sm" data-close type="button" aria-label="关闭"><svg class="i"><use href="#i-close"/></svg></button>
    </div>
    <div class="sheet-body" id="effort-list"></div>
  </div>
</div>

<!-- 附件 -->
<div id="sheet-attach" class="sheet hidden" role="dialog" aria-modal="true" aria-label="添加附件">
  <div class="sheet-scrim" data-close></div>
  <div class="sheet-panel auto">
    <div class="sheet-grip"></div>
    <div class="sheet-body">
      <div class="attach-row">
        <button class="attach-btn" id="att-camera" type="button">
          <span class="ico"><svg class="i lg"><use href="#i-camera"/></svg></span>拍照
        </button>
        <button class="attach-btn" id="att-photo" type="button">
          <span class="ico"><svg class="i lg"><use href="#i-image"/></svg></span>相册
        </button>
        <button class="attach-btn" id="att-file" type="button">
          <span class="ico"><svg class="i lg"><use href="#i-file"/></svg></span>文件
        </button>
      </div>
      <p class="sheet-tip" id="attach-tip" style="text-align:center;margin-bottom:8px"></p>
    </div>
  </div>
</div>

<!-- 系统提示词 -->
<div id="sheet-system" class="sheet hidden" role="dialog" aria-modal="true" aria-label="系统提示词">
  <div class="sheet-scrim" data-close></div>
  <div class="sheet-panel tall">
    <div class="sheet-grip"></div>
    <div class="sheet-head">
      <span class="t">系统提示词</span>
      <button class="icon-btn sm" data-close type="button" aria-label="关闭"><svg class="i"><use href="#i-close"/></svg></button>
    </div>
    <div class="sheet-body">
      <p class="sheet-tip">只对当前对话生效。留空表示不设置。</p>
      <textarea id="system-input" class="input" placeholder="例如：你是一名严谨的技术编辑，回答先给结论，再给依据。"
                spellcheck="false" style="min-height:130px"></textarea>
      <div class="section-label">常用预设</div>
      <div id="system-presets" style="display:flex;flex-wrap:wrap;gap:8px"></div>
    </div>
    <div class="sheet-actions">
      <button id="system-save" class="btn btn-primary btn-block" type="button">保存</button>
    </div>
  </div>
</div>

<!-- 提示词库 -->
<div id="sheet-prompts" class="sheet hidden" role="dialog" aria-modal="true" aria-label="提示词库">
  <div class="sheet-scrim" data-close></div>
  <div class="sheet-panel tall">
    <div class="sheet-grip"></div>
    <div class="sheet-head">
      <span class="t">提示词库</span>
      <button class="icon-btn sm" data-close type="button" aria-label="关闭"><svg class="i"><use href="#i-close"/></svg></button>
    </div>
    <div class="sheet-body" id="prompt-list"></div>
    <div class="sheet-actions">
      <button id="prompt-add" class="btn btn-block" type="button">
        <svg class="i sm"><use href="#i-plus"/></svg>新建提示词
      </button>
    </div>
  </div>
</div>

<!-- 设置 -->
<div id="sheet-settings" class="sheet hidden" role="dialog" aria-modal="true" aria-label="设置">
  <div class="sheet-scrim" data-close></div>
  <div class="sheet-panel tall">
    <div class="sheet-grip"></div>
    <div class="sheet-head">
      <span class="t">设置</span>
      <button class="icon-btn sm" data-close type="button" aria-label="关闭"><svg class="i"><use href="#i-close"/></svg></button>
    </div>
    <div class="sheet-body" id="settings-body"></div>
  </div>
</div>

<!-- 消息操作 -->
<div id="sheet-actions" class="sheet hidden" role="dialog" aria-modal="true" aria-label="消息操作">
  <div class="sheet-scrim" data-close></div>
  <div class="sheet-panel auto">
    <div class="sheet-grip"></div>
    <div class="sheet-body" style="padding-top:8px">
      <div class="action-list" id="action-list"></div>
    </div>
  </div>
</div>

<!-- 确认 -->
<div id="sheet-confirm" class="sheet hidden" role="dialog" aria-modal="true" aria-label="确认">
  <div class="sheet-scrim" data-close></div>
  <div class="sheet-panel auto">
    <div class="sheet-grip"></div>
    <div class="sheet-body" style="padding-top:12px">
      <p id="confirm-text" style="margin:0 0 4px;font-size:15px;line-height:1.6;color:var(--ink)"></p>
    </div>
    <div class="sheet-actions" style="display:flex;gap:10px">
      <button id="confirm-cancel" class="btn btn-block" type="button">取消</button>
      <button id="confirm-ok" class="btn btn-primary btn-block" type="button">确定</button>
    </div>
  </div>
</div>

<!-- 诊断 -->
<div id="sheet-diag" class="sheet hidden" role="dialog" aria-modal="true" aria-label="连接诊断">
  <div class="sheet-scrim" data-close></div>
  <div class="sheet-panel tall">
    <div class="sheet-grip"></div>
    <div class="sheet-head">
      <span class="t">连接诊断</span>
      <button class="icon-btn sm" data-close type="button" aria-label="关闭"><svg class="i"><use href="#i-close"/></svg></button>
    </div>
    <div class="sheet-body">
      <div class="row"><span class="lbl">通道</span><span class="val" id="diag-mode">—</span></div>
      <div class="row"><span class="lbl">网络</span><span class="val" id="diag-net">检测中…</span></div>
      <div class="row"><span class="lbl">登录态</span><span class="val" id="diag-auth">—</span></div>
      <div class="row"><span class="lbl">最近错误</span><span class="val" id="diag-err">—</span></div>
      <div style="display:flex;flex-direction:column;gap:10px;margin-top:20px">
        <button id="diag-retest" class="btn btn-block" type="button">重新检测</button>
        <button id="diag-proxy" class="btn btn-block" type="button">改用代理</button>
        <button id="diag-direct" class="btn btn-block" type="button">恢复直连</button>
      </div>
      <p class="sheet-tip" style="margin-top:16px">直连模式下由 App 自身完成人机验证与短信登录，手机里不需要再跑任何服务。</p>
    </div>
  </div>
</div>

<!-- 隐藏输入 -->
<input id="file-image" type="file" accept="image/*" multiple class="hidden-input" aria-hidden="true">
<input id="file-camera" type="file" accept="image/*" capture="environment" class="hidden-input" aria-hidden="true">
<input id="file-doc" type="file" multiple class="hidden-input" aria-hidden="true">

<style>.hidden-input{position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0}</style>

<div id="toast" role="status" aria-live="polite"></div>

<script src="/native.js"></script>
<script src="/markdown.js"></script>
<script src="/direct.js"></script>
<script src="/js/core.js"></script>
<script src="/js/store.js"></script>
<script src="/js/api.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/thread.js"></script>
<script src="/js/settings.js"></script>
<script src="/js/composer.js"></script>
<script src="/js/prompts.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
