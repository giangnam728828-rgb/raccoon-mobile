<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0f17">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>小浣熊</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<!-- ============ 登录 ============ -->
<section id="login-view" class="view active">
  <div class="login-wrap">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 48 48" fill="none" aria-hidden="true">
        <defs>
          <linearGradient id="raccoon-face" x1="24" y1="12" x2="24" y2="41" gradientUnits="userSpaceOnUse">
            <stop stop-color="#2e3a4f"/><stop offset="1" stop-color="#161d29"/>
          </linearGradient>
          <linearGradient id="raccoon-ring" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
            <stop stop-color="#f59e0b" stop-opacity=".55"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
          </linearGradient>
        </defs>
        <circle cx="24" cy="24" r="22.5" fill="url(#raccoon-ring)" opacity=".16"/>
        <circle cx="24" cy="24" r="21" stroke="url(#raccoon-ring)" stroke-width="1.2"/>
        <circle cx="11.5" cy="15" r="6.2" fill="#243044"/>
        <circle cx="36.5" cy="15" r="6.2" fill="#243044"/>
        <circle cx="11.5" cy="15" r="3" fill="#f59e0b" opacity=".42"/>
        <circle cx="36.5" cy="15" r="3" fill="#f59e0b" opacity=".42"/>
        <ellipse cx="24" cy="26" rx="15.6" ry="14.2" fill="url(#raccoon-face)" stroke="#3a4a63" stroke-width="1"/>
        <path d="M9.8 23.4c0-3.6 3.3-6.1 7.4-6.1 3.8 0 6.3 2.5 6.3 5.9 0 3.5-2.9 6.2-6.7 6.2-4.1 0-7-2.4-7-6z" fill="#080c13"/>
        <path d="M38.2 23.4c0-3.6-3.3-6.1-7.4-6.1-3.8 0-6.3 2.5-6.3 5.9 0 3.5 2.9 6.2 6.7 6.2 4.1 0 7-2.4 7-6z" fill="#080c13"/>
        <circle cx="17.1" cy="23.8" r="2.15" fill="#ffffff"/>
        <circle cx="30.9" cy="23.8" r="2.15" fill="#ffffff"/>
        <circle cx="17.5" cy="24.2" r="1.15" fill="#0b0f17"/>
        <circle cx="31.3" cy="24.2" r="1.15" fill="#0b0f17"/>
        <circle cx="17.9" cy="23.5" r=".55" fill="#fff" opacity=".9"/>
        <circle cx="31.7" cy="23.5" r=".55" fill="#fff" opacity=".9"/>
        <path d="M24 29.6l-2.3 2.1h4.6L24 29.6z" fill="#f59e0b"/>
        <path d="M20.8 34.2c1.1 1.5 5.3 1.5 6.4 0" stroke="#7b8aa1" stroke-width="1.3" stroke-linecap="round"/>
      </svg>
      <h1>小浣熊</h1>
      <p class="brand-sub">多模型 · 深度思考 · 手机端</p>
    </div>

    <!-- 手机号验证码登录 -->
    <div class="login-actions">
      <label class="field-label" for="phone">手机号</label>
      <div class="field-row">
        <select id="nation" class="nation-select" aria-label="国家/地区代码"></select>
        <input id="phone" class="field-input" type="tel" inputmode="numeric" autocomplete="tel"
               placeholder="请输入手机号" maxlength="20">
      </div>

      <label class="field-label" for="code">短信验证码</label>
      <div class="field-row">
        <input id="code" class="field-input" type="text" inputmode="numeric" autocomplete="one-time-code"
               placeholder="6 位验证码" maxlength="8">
        <button id="btn-send-code" class="btn-code" type="button">获取验证码</button>
      </div>

      <button id="btn-login" class="btn primary" type="button">登录 / 注册</button>
      <p class="login-hint">未注册的手机号将自动创建账号</p>
    </div>

    <div class="login-alt">
      <button id="btn-token-toggle" class="link-btn" type="button">使用 Token 登录</button>
    </div>

    <div id="token-panel" class="panel hidden">
      <div class="panel-head">
        <span>Token 登录</span>
        <button class="icon-btn sm" data-back="token" type="button" aria-label="关闭">✕</button>
      </div>
      <textarea id="token-input" placeholder="粘贴 access_token（JWT，可带 Bearer 前缀）" spellcheck="false"></textarea>
      <button id="btn-token-go" class="btn primary" type="button">登录</button>
    </div>

    <p id="login-msg" class="login-msg hidden" role="alert"></p>
    <p class="login-foot">
      <span id="login-proxy" class="mono">—</span>
      <button id="btn-conn-login" class="linkish" type="button">修改</button>
    </p>
  </div>

  <!-- 阿里云人机验证的挂载点（SDK 会把验证码渲染在这里） -->
  <div id="cap-element"></div>
  <button id="cap-button" type="button" hidden>captcha</button>
</section>

<!-- ============ 聊天 ============ -->
<section id="chat-view" class="view">
  <header class="topbar">
    <div class="top-left">
      <span class="status-dot" id="status-dot"></span>
      <span class="top-name" id="me-name">小浣熊</span>
    </div>
    <div class="top-right">
      <span class="points" id="points-badge">积分</span>
      <button id="btn-models" class="icon-btn" title="选择模型" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      </button>
      <button id="btn-settings" class="icon-btn" title="设置" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
  </header>

  <div class="model-bar">
    <button id="model-name" class="model-pill" type="button">
      <span class="model-pill-label">模型</span>
      <span class="model-pill-val" id="model-name-val">默认</span>
      <svg class="caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
    </button>
    <label class="switch">
      <input type="checkbox" id="think-toggle">
      <span class="switch-track"><span class="switch-thumb"></span></span>
      <span class="switch-label">深度思考</span>
    </label>
  </div>

  <main id="messages" class="messages"></main>

  <footer class="composer">
    <button id="btn-voice" class="icon-btn" title="语音输入" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v3"/></svg>
    </button>
    <div class="input-wrap">
      <textarea id="input" rows="1" placeholder="输入消息，或点麦克风说话…"></textarea>
    </div>
    <button id="btn-send" class="send-btn" type="button" disabled aria-label="发送">
      <svg class="ico-send" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4 20-7z"/></svg>
      <svg class="ico-stop hidden" viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>
    </button>
  </footer>
</section>

<!-- ============ 模型选择 ============ -->
<div id="model-sheet" class="sheet hidden">
  <div class="sheet-scrim" data-close="model-sheet"></div>
  <div class="sheet-panel">
    <div class="sheet-head">
      <span>选择模型</span>
      <button class="icon-btn sm" data-close="model-sheet" type="button">✕</button>
    </div>
    <div id="model-list" class="sheet-body"></div>
  </div>
</div>

<!-- ============ 设置 ============ -->
<div id="settings-sheet" class="sheet hidden">
  <div class="sheet-scrim" data-close="settings-sheet"></div>
  <div class="sheet-panel">
    <div class="sheet-head">
      <span>设置</span>
      <button class="icon-btn sm" data-close="settings-sheet" type="button">✕</button>
    </div>
    <div class="sheet-body">
      <div class="set-group">
        <div class="set-title">账号信息</div>
        <div class="row"><span>账号</span><span id="set-name">—</span></div>
        <div class="row"><span>手机号</span><span id="set-phone">—</span></div>
        <div class="row"><span>当前模型</span><span id="set-model">—</span></div>
        <div class="row"><span>深度思考</span><span id="set-think">关</span></div>
        <div class="row"><span>剩余积分</span><span id="set-points">—</span></div>
      </div>
      <div class="set-group">
        <div class="set-title">连接</div>
        <button class="row row-btn" id="row-proxy" type="button">
          <span>代理地址</span><span id="set-proxy" class="mono">—</span>
        </button>
        <button class="row row-btn" id="btn-test-conn" type="button">
          <span>连接状态</span><span id="set-conn">检测中…</span>
        </button>
      </div>
      <div class="set-group">
        <div class="set-title">积分</div>
        <button id="btn-checkin" class="btn" type="button">领取每日积分</button>
        <button id="btn-onboarding" class="btn" type="button">领取新手奖励</button>
      </div>
      <div class="set-group">
        <button id="btn-logout" class="btn danger" type="button">退出登录</button>
      </div>
    </div>
  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="/app.js"></script>
</body>
</html>
